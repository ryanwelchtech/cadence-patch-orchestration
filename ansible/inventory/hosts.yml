# Wave-grouped inventory. The orchestration in core/ decides membership from
# role/env/az + maintenance windows; this file is the materialized plan Ansible
# executes. Groups mirror the planner: a canary, then staging, then prod waves.
all:
  vars:
    ansible_user: patchadmin
    health_url: "https://localhost:8443/healthz"   # per-host readiness probe
    reboot_timeout: 600
  children:
    canary:
      hosts:
        cache-s01: { az: a }
        db-s02: { az: b }
    staging:
      hosts:
        db-s01: { az: a }
        web-s01: { az: a }
        web-s02: { az: b }
        app-s01: { az: a }
        app-s02: { az: b }
    prod:
      children:
        prod_web: { hosts: { web-p01: {az: a}, web-p02: {az: b}, web-p03: {az: c}, web-p04: {az: a}, web-p05: {az: b}, web-p06: {az: c} } }
        prod_app: { hosts: { app-p01: {az: a}, app-p02: {az: b}, app-p03: {az: c}, app-p04: {az: a}, app-p05: {az: b}, app-p06: {az: c} } }
        prod_db:  { hosts: { db-p01: {az: a}, db-p02: {az: b}, db-p03: {az: c}, db-p04: {az: a} } }
        prod_cache: { hosts: { cache-p01: {az: a} } }
      vars:
        # prod maintenance window — the playbook refuses to run outside it
        maint_window_start: 1
        maint_window_end: 5
