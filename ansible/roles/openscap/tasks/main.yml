---
# Evaluate the DISA STIG profile with OpenSCAP and keep the before/after score.
- name: Ensure scanner content is present
  ansible.builtin.package:
    name: [openscap-scanner, scap-security-guide]
    state: present

- name: Run oscap xccdf eval against the RHEL 9 STIG profile
  ansible.builtin.command: >
    oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_stig
    --results /var/tmp/cadence-scap-{{ scap_phase }}.xml
    --report /var/tmp/cadence-scap-{{ scap_phase }}.html
    /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
  register: oscap
  failed_when: oscap.rc not in [0, 2]    # rc 2 = scan ran, some rules failed
  changed_when: false

- name: Extract the pass ratio
  ansible.builtin.shell: >
    set -o pipefail;
    p=$(grep -c 'result>pass' /var/tmp/cadence-scap-{{ scap_phase }}.xml || echo 0);
    f=$(grep -c 'result>fail' /var/tmp/cadence-scap-{{ scap_phase }}.xml || echo 0);
    awk "BEGIN{printf \"%.3f\", $p/($p+$f+0.0001)}"
  register: scap_ratio
  changed_when: false

- name: Store the score fact
  ansible.builtin.set_fact:
    "scap_{{ scap_phase }}": "{{ scap_ratio.stdout }}"
